<!doctype html>
<html>
<head><meta charset="utf-8"><title>IpField — önizleme</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>body{margin:0;padding:16px;background:var(--surface-100);color:var(--ink);font:400 14px/20px var(--font-sans)}#root{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Tracklight, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(T.IpField, { id: 'ip-now', label: 'Cihaz IP', defaultValue: '192.168.144.108', hint: 'Komut portu 12350' }),
    h(T.IpField, { id: 'ip-local', label: 'Yerel IP', defaultValue: '192.168.144.54' })
  ));
</script>
</body>
</html>
