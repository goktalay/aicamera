<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog — önizleme</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>body{margin:0;padding:16px;background:var(--surface-100);color:var(--ink);font:400 14px/20px var(--font-sans)}#root{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Tracklight, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(T.Dialog, { kind: 'question', title: 'IP adresini değiştir', confirmLabel: 'IP adresini değiştir', destructive: true, onCancel: function(){}, onConfirm: function(){} },
      h('p', null, 'Cihazın IP adresi 192.168.144.120 olacak. Bağlantı kopacak; yeni adresle yeniden bağlanmanız gerekir.')),
    h(T.Dialog, { kind: 'error', title: 'IR cihazı bulunamadı', confirmLabel: 'Tamam', onConfirm: function(){} },
      h('p', null, 'IR cihazı yanıt vermiyor. Adresi ve kabloyu kontrol edin.'))
  ));
</script>
</body>
</html>
