<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusChip — önizleme</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>body{margin:0;padding:16px;background:var(--surface-100);color:var(--ink);font:400 14px/20px var(--font-sans)}#root{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Tracklight, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(T.StatusChip, { tone: 'ok' }, 'Bağlı · 192.168.144.108'),
    h(T.StatusChip, { tone: 'danger' }, 'Bağlantı hatası'),
    h(T.StatusChip, { tone: 'warn' }, 'Yeniden bağlanıyor'),
    h(T.StatusChip, { tone: 'record' }, 'Kaydediliyor'),
    h(T.StatusChip, { tone: 'busy' }, 'Takip ediliyor'),
    h(T.StatusChip, null, 'Bağlı değil')
  ));
</script>
</body>
</html>
