<!doctype html>
<html>
<head><meta charset="utf-8"><title>ControlButton — önizleme</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>body{margin:0;padding:16px;background:var(--surface-100);color:var(--ink);font:400 14px/20px var(--font-sans)}#root{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Tracklight, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(T.ControlButton, { icon: 'photo', label: 'Fotoğraf', pressed: false }),
    h(T.ControlButton, { icon: 'record', pressedIcon: 'stop', label: 'Kayıt', pressedLabel: 'Durdur', tone: 'record', defaultPressed: true }),
    h(T.ControlButton, { icon: 'pip', label: 'PIP' }),
    h(T.ControlButton, { icon: 'sbs', label: 'SBS' }),
    h(T.ControlButton, { icon: 'swap', label: 'IR / TV', pressed: false }),
    h(T.ControlButton, { icon: 'track', label: 'AI takip', defaultPressed: true }),
    h(T.ControlButton, { icon: 'laser', label: 'Lazer' })
  ));
</script>
</body>
</html>
